<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>قائممقامية قضاء الفلوجة - شعبة المنظمات</title>
<style>
/* تعريف خط be IN Normal وتطبيقه على كافة عناصر الموقع */
@font-face{
  font-family:'be IN Normal';
  src:local('be IN Normal'),local('beIN Normal'),local('beINNormal'),
      url('https://cdn.jsdelivr.net/gh/nicholas-c-s/arabic-fonts@main/beIN-Normal.woff2') format('woff2'),
      url('https://cdn.jsdelivr.net/gh/nicholas-c-s/arabic-fonts@main/beIN-Normal.ttf') format('truetype');
  font-weight:100 900;
  font-style:normal;
  font-display:swap;
}
:root{
  --bg:#f6f4ef;
  --surface:#ffffff;
  --surface-alt:#faf8f3;
  --text:#1c1917;
  --muted:#57534e;
  --border:#e2dcd0;
  --gold:#facc15;
  --gold-deep:#b45309;
  --danger:#dc2626;
  --slate:#181f29;
  --shadow:0 12px 28px rgba(28,25,23,.12);
}
body.dark{
  --bg:#0f1319;
  --surface:#181f29;
  --surface-alt:#202936;
  --text:#f5f5f4;
  --muted:#a8a29e;
  --border:#2e3846;
  --shadow:0 14px 32px rgba(0,0,0,.55);
}
*,*::before,*::after{box-sizing:border-box;font-family:'be IN Normal','Segoe UI',Tahoma,sans-serif}
html,body{margin:0;padding:0;min-height:100vh;background:var(--bg);color:var(--text);transition:background .25s,color .25s;overflow-x:hidden}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer;border:none;outline:none;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}

/* 1. الواجهة الرئيسية المعمارية الصافية بألوان الحجر الرملي الدافئ بدون أي لون أزرق أو بطاقات بيضاء أو أعلام */
#landing{
  position:relative;min-height:100vh;width:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:24px;
  background:linear-gradient(180deg,#5a4635 0%,#8d7155 40%,#b79876 74%,#3a2d22 100%);
  overflow:hidden;
}
.facade-svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.44;pointer-events:none;z-index:0}
.facade-overlay{
  position:absolute;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(circle at 50% 24%,rgba(255,236,195,.22),transparent 58%),
             linear-gradient(180deg,rgba(24,20,16,.46) 0%,rgba(24,20,16,.28) 50%,rgba(20,17,14,.68) 100%);
}
.top-controls{position:fixed;top:16px;left:16px;display:flex;gap:10px;z-index:90}
.ctrl-circle{
  width:44px;height:44px;border-radius:50%;background:rgba(24,31,41,.82);color:#facc15;
  border:1.5px solid rgba(250,204,21,.5);font-size:15px;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.35);
  transition:transform .15s,background .2s;
}
.ctrl-circle:active{transform:scale(.92)}
.landing-box{position:relative;z-index:25;max-width:720px;width:100%;padding:12px}
.gov-line1{color:#ffffff;font-size:clamp(1.05rem,3.2vw,1.4rem);font-weight:700;margin:0 0 8px;text-shadow:0 2px 12px rgba(0,0,0,.8)}
.gov-line2{color:#ffffff;font-size:clamp(1.85rem,5.8vw,3rem);font-weight:900;margin:0 0 8px;text-shadow:0 4px 16px rgba(0,0,0,.85);line-height:1.28}
.gov-line3{color:#fef08a;font-size:clamp(1.2rem,4vw,1.7rem);font-weight:800;margin:0 0 32px;text-shadow:0 2px 12px rgba(0,0,0,.85)}
.enter-btn{
  position:relative;z-index:50;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(135deg,#facc15 0%,#eab308 100%);color:#1c1917;
  font-size:1.15rem;font-weight:900;padding:15px 42px;border-radius:999px;
  box-shadow:0 10px 28px rgba(234,179,8,.45),0 2px 6px rgba(0,0,0,.45);
  border:2px solid #fef08a;transition:transform .15s,box-shadow .2s;
}
.enter-btn:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(234,179,8,.6)}
.enter-btn:active{transform:scale(.96)}

/* 2. ترويسة لوحة التحكم (خلفية المبنى بنسبة 50% وبدون أي علم عراقي نهائياً) */
#dashboard{min-height:100vh;padding-bottom:48px}
.dash-header{
  position:relative;background:var(--slate);color:#fff;padding:64px 16px 26px;
  text-align:center;border-bottom:3px solid rgba(250,204,21,.5);overflow:hidden;
}
.dash-header-bg{position:absolute;inset:0;width:100%;height:100%;opacity:.5;pointer-events:none;z-index:0}
.dash-header-inner{position:relative;z-index:10;max-width:960px;margin:0 auto}
.gold-title{
  color:#facc15;font-size:clamp(1.65rem,5.5vw,2.8rem);font-weight:900;margin:0 0 6px;
  text-shadow:0 3px 16px rgba(0,0,0,.85),0 0 24px rgba(250,204,21,.28);line-height:1.35;
}
.dash-sub{color:#f5f5f4;font-size:1.1rem;font-weight:700;margin:0 0 18px;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.header-pills{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.pill-nav{
  display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:14px;
  background:rgba(255,255,255,.1);color:#fff;border:1.5px solid rgba(250,204,21,.5);
  font-size:.95rem;font-weight:700;transition:background .2s,transform .15s;
}
.pill-nav:active{transform:scale(.96)}
.pill-logout{
  display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:14px;
  background:var(--danger);color:#fff;font-size:.95rem;font-weight:700;
  box-shadow:0 4px 14px rgba(220,38,38,.4);transition:transform .15s;
}
.pill-logout:active{transform:scale(.96)}

/* الحاوية الرئيسية وعناوين "القسم الأول" و"القسم الثاني" والخط الأفقي الممتد على كامل العرض */
.container{max-width:1140px;margin:20px auto 0;padding:0 14px}
.section-header-bar{width:100%;margin:4px 0 14px;text-align:start}
.section-bar-title{
  margin:0 0 10px;
  font-size:clamp(1.25rem,3.6vw,1.65rem);
  font-weight:900;
  color:var(--gold-deep);
  letter-spacing:.2px;
  display:inline-flex;
  align-items:center;
  gap:8px;
}
body.dark .section-bar-title{color:#facc15}
.section-bar-line{
  width:100%;
  height:3px;
  border-radius:999px;
  background:linear-gradient(90deg,var(--gold-deep) 0%,#facc15 50%,var(--gold-deep) 100%);
  box-shadow:0 2px 10px rgba(250,204,21,.32);
}

/* مسرح البطاقات ثلاثي الأبعاد 3D Coverflow Stage نظيف بدون أسهم أو نقاط أو نصوص إرشادية */
.carousel-3d-wrap{position:relative;width:100%;padding:12px 0 24px;user-select:none;touch-action:pan-y}
.carousel-3d-stage{
  position:relative;width:100%;height:295px;perspective:1100px;transform-style:preserve-3d;
  display:flex;align-items:center;justify-content:center;overflow:visible;
}
.sec-card-3d{
  position:absolute;width:min(84vw,390px);min-height:235px;background:var(--surface);
  border:2px solid var(--border);border-radius:24px;padding:22px 20px;
  box-shadow:0 20px 44px rgba(0,0,0,.22);display:flex;flex-direction:column;
  justify-content:space-between;gap:14px;cursor:pointer;backface-visibility:hidden;
  transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.22,.9,.32,1),opacity .45s ease,border-color .3s ease,box-shadow .4s ease;
}
.sec-card-3d.is-center{
  border-color:var(--gold-deep);
  box-shadow:0 24px 52px rgba(180,83,9,.24),0 0 0 2px rgba(250,204,21,.48);
}
body.dark .sec-card-3d.is-center{
  border-color:#facc15;
  box-shadow:0 26px 56px rgba(0,0,0,.68),0 0 24px rgba(250,204,21,.22);
}
.card-top{display:flex;align-items:center;justify-content:space-between}
.card-icon{
  width:52px;height:52px;border-radius:16px;background:rgba(250,204,21,.18);
  color:var(--gold-deep);display:flex;align-items:center;justify-content:center;
}
body.dark .card-icon{color:#facc15;background:rgba(250,204,21,.15)}
.badge{
  padding:5px 13px;border-radius:999px;font-size:.82rem;font-weight:700;
  background:var(--surface-alt);color:var(--muted);border:1px solid var(--border);
}
.card-title{font-size:1.24rem;font-weight:900;margin:0;color:var(--text);line-height:1.35}

/* شريط الكتابة الآلية المتحركة المستمرة داخل البطاقات */
.tw-bar{
  background:var(--surface-alt);border:1px solid var(--border);border-radius:999px;
  padding:10px 14px;min-height:42px;display:flex;align-items:center;overflow:hidden;
}
.tw-text{font-size:.86rem;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tw-cursor{
  display:inline-block;width:2px;height:15px;background:var(--gold-deep);
  margin-inline-start:3px;animation:blink .8s infinite;flex-shrink:0;
}
body.dark .tw-cursor{background:#facc15}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

/* بطاقة القسم الثاني (عناوين في الوسط بنفس حجم خط القسم الأول + مربعات الإدخال) */
.feedback-card{
  background:var(--surface);border:1.5px solid var(--border);border-radius:24px;
  padding:24px 20px;box-shadow:var(--shadow);margin-top:6px;
}
.feedback-grid{display:grid;grid-template-columns:1fr;gap:18px;max-width:780px;margin:0 auto}
.fb-centered-title{
  display:block;
  width:100%;
  text-align:center;
  margin:0 0 10px;
  font-size:clamp(1.25rem,3.6vw,1.65rem);
  font-weight:900;
  color:var(--gold-deep);
  letter-spacing:.2px;
}
body.dark .fb-centered-title{color:#facc15}
.feedback-email{
  width:100%;padding:13px 16px;border-radius:16px;
  border:1.5px solid var(--border);background:var(--surface-alt);color:var(--text);
  font-size:.98rem;text-align:center;transition:border-color .2s,box-shadow .2s;
}
.feedback-textarea{
  width:100%;min-height:145px;padding:15px 16px;border-radius:18px;
  border:1.5px solid var(--border);background:var(--surface-alt);color:var(--text);
  font-size:.98rem;resize:vertical;line-height:1.7;transition:border-color .2s,box-shadow .2s;
}
.feedback-textarea:focus,.feedback-email:focus{
  border-color:var(--gold-deep);outline:none;box-shadow:0 0 0 3px rgba(250,204,21,.22);
}
body.dark .feedback-textarea:focus,body.dark .feedback-email:focus{border-color:#facc15}

/* الانتقال ثلاثي الأبعاد 3D بين الخانات الداخلية */
.sec-tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.sec-tabs::-webkit-scrollbar{display:none}
.sec-tab{
  white-space:nowrap;padding:9px 15px;border-radius:14px;font-size:.88rem;font-weight:800;
  background:var(--surface);color:var(--muted);border:1.5px solid var(--border);
  transition:all .22s ease;
}
.sec-tab.active{background:linear-gradient(135deg,#facc15,#eab308);color:#1c1917;border-color:#fef08a}
.panel-3d-vp{perspective:1200px;touch-action:pan-y}
.panel{
  background:var(--surface);border:1.5px solid var(--border);border-radius:22px;
  padding:18px;box-shadow:var(--shadow);transform-style:preserve-3d;
}
.panel.turn-next{animation:turn3dNext .48s cubic-bezier(.22,.9,.32,1)}
.panel.turn-prev{animation:turn3dPrev .48s cubic-bezier(.22,.9,.32,1)}
@keyframes turn3dNext{0%{opacity:.35;transform:perspective(1200px) rotateY(-28deg) scale(.96)}100%{opacity:1;transform:perspective(1200px) rotateY(0deg) scale(1)}}
@keyframes turn3dPrev{0%{opacity:.35;transform:perspective(1200px) rotateY(28deg) scale(.96)}100%{opacity:1;transform:perspective(1200px) rotateY(0deg) scale(1)}}

/* شريط الأدوات والأزرار والقائمة المنسدلة والجداول والمعرض */
.panel-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.panel-title{margin:0;font-size:1.25rem;font-weight:900}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:14px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 15px;
  border-radius:12px;font-size:.88rem;font-weight:800;transition:transform .15s,opacity .2s;
}
.btn:active{transform:scale(.96)}
.btn-gold{background:linear-gradient(135deg,#facc15,#eab308);color:#1c1917;border:1px solid #fde047}
.btn-outline{background:var(--surface-alt);color:var(--text);border:1.5px solid var(--border)}
.btn-danger{background:var(--danger);color:#fff}
.search-box{
  flex:1;min-width:200px;padding:9px 14px;border-radius:12px;border:1.5px solid var(--border);
  background:var(--surface-alt);color:var(--text);font-size:.9rem;
}
.dropdown{position:relative;display:inline-block}
.dropdown-menu{
  position:absolute;top:calc(100% + 6px);inset-inline-start:0;min-width:195px;
  background:var(--surface);border:1.5px solid var(--border);border-radius:14px;
  box-shadow:0 12px 28px rgba(0,0,0,.22);padding:6px;z-index:60;
}
.dropdown-item{
  width:100%;text-align:start;padding:10px 12px;border-radius:10px;background:transparent;
  color:var(--text);font-size:.88rem;font-weight:700;display:block;
}
.dropdown-item:hover{background:var(--surface-alt)}
.dropdown-item.danger{color:var(--danger)}

.filter-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{padding:7px 14px;border-radius:999px;font-size:.84rem;font-weight:700;background:var(--surface-alt);color:var(--muted);border:1px solid var(--border)}
.chip.active{background:var(--gold);color:#1c1917;border-color:#eab308}

.sel-bar{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:10px 14px;border-radius:14px;background:rgba(220,38,38,.1);border:1.5px solid rgba(220,38,38,.35);
  margin-bottom:14px;
}
.table-wrap{width:100%;overflow-x:auto;border-radius:14px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;min-width:620px}
th,td{padding:11px 12px;text-align:start;border-bottom:1px solid var(--border);font-size:.88rem}
th{background:var(--surface-alt);font-weight:900;color:var(--text)}
.status-pill{padding:4px 10px;border-radius:999px;font-size:.8rem;font-weight:700;background:rgba(250,204,21,.22);color:var(--gold-deep)}
body.dark .status-pill{color:#facc15}

.privacy-box{
  padding:32px 18px;text-align:center;border-radius:18px;
  background:var(--surface-alt);border:1.5px dashed var(--border);color:var(--muted);font-size:.95rem;
}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.gal-item{
  position:relative;background:var(--surface-alt);border:1.5px solid var(--border);
  border-radius:18px;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.08);
}
.gal-thumb{
  height:165px;background:linear-gradient(135deg,#8d7155,#5a4635);color:#fef08a;
  display:flex;align-items:center;justify-content:center;font-weight:800;padding:12px;
  text-align:center;cursor:pointer;overflow:hidden;
}
.gal-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.gal-body{padding:12px}

/* النوافذ المنبثقة والطباعة */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;
  justify-content:center;padding:16px;z-index:100;
}
.modal-card{
  width:100%;max-width:460px;background:var(--surface);color:var(--text);
  border-radius:20px;padding:20px;border:1.5px solid var(--border);box-shadow:0 20px 44px rgba(0,0,0,.4);
  max-height:90vh;overflow-y:auto;
}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:.86rem;font-weight:800;margin-bottom:5px}
.form-group input,.form-group select{
  width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid var(--border);
  background:var(--surface-alt);color:var(--text);font-size:.9rem;
}
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#181f29;
  color:#facc15;padding:11px 22px;border-radius:999px;font-weight:800;font-size:.9rem;
  border:1.5px solid rgba(250,204,21,.5);box-shadow:0 10px 24px rgba(0,0,0,.4);z-index:120;
}
.print-header{display:none}
@media print{
  .no-print,#landing,.dash-header,.sec-tabs,.toolbar,.filter-chips,.sel-bar{display:none!important}
  body,#dashboard,.container,.panel{background:#fff!important;color:#000!important;box-shadow:none!important;border:none!important;padding:0!important;margin:0!important}
  .print-header{display:block;text-align:center;border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:16px}
  .table-wrap{border:none!important;overflow:visible!important}
  table{min-width:100%!important;border:1px solid #000}
  th,td{border:1px solid #000!important;color:#000!important}
  th:last-child,td:last-child{display:none!important}
}
</style>
</head>
<body>

<!-- أزرار المظهر الصباحي/الليلي واللغة -->
<div class="top-controls no-print">
  <button type="button" class="ctrl-circle" id="themeBtn" aria-label="تبديل المظهر">☀</button>
  <button type="button" class="ctrl-circle" id="langBtn" aria-label="تبديل اللغة">EN</button>
</div>

<!-- 1. الواجهة الرئيسية المعمارية الصافية بألوان الحجر الرملي الدافئ بدون أي لون أزرق أو بطاقات بيضاء أو أعلام -->
<section id="landing">
  <svg class="facade-svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="sandWall" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#d6be9c"/>
        <stop offset="100%" stop-color="#9e7f5c"/>
      </linearGradient>
    </defs>
    <rect width="1200" height="700" fill="url(#sandWall)"/>
    <rect x="80" y="130" width="1040" height="490" rx="12" fill="#b79670" stroke="#755b3e" stroke-width="4"/>
    <rect x="110" y="105" width="980" height="32" fill="#8b6d4c"/>
    <g fill="#4a3826" opacity="0.72">
      <path d="M170,340 V230 A45,45 0 0,1 260,230 V340 Z"/>
      <path d="M320,340 V230 A45,45 0 0,1 410,230 V340 Z"/>
      <path d="M470,340 V230 A45,45 0 0,1 560,230 V340 Z"/>
      <path d="M640,340 V230 A45,45 0 0,1 730,230 V340 Z"/>
      <path d="M790,340 V230 A45,45 0 0,1 880,230 V340 Z"/>
      <path d="M940,340 V230 A45,45 0 0,1 1030,230 V340 Z"/>
      <path d="M170,580 V440 A45,45 0 0,1 260,440 V580 Z"/>
      <path d="M320,580 V440 A45,45 0 0,1 410,440 V580 Z"/>
      <path d="M535,580 V420 A65,65 0 0,1 665,420 V580 Z"/>
      <path d="M790,580 V440 A45,45 0 0,1 880,440 V580 Z"/>
      <path d="M940,580 V440 A45,45 0 0,1 1030,440 V580 Z"/>
    </g>
    <rect x="60" y="610" width="1080" height="40" fill="#6b5237"/>
  </svg>
  <div class="facade-overlay"></div>

  <div class="landing-box">
    <p class="gov-line1" id="tGov1">جمهورية العراق</p>
    <h1 class="gov-line2" id="tGov2">محافظة الأنبار - قائممقامية قضاء الفلوجة</h1>
    <p class="gov-line3" id="tGov3">شعبة المنظمات</p>
    <button type="button" class="enter-btn" id="enterBtn">دخول إلى النظام</button>
  </div>
</section>

<!-- 2. لوحة التحكم -->
<main id="dashboard" class="hidden">
  <header class="dash-header no-print">
    <svg class="dash-header-bg" viewBox="0 0 1200 320" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <rect width="1200" height="320" fill="#8d7155"/>
      <g fill="#2b2117" opacity="0.75">
        <path d="M120,300 V130 A55,55 0 0,1 230,130 V300 Z"/>
        <path d="M310,300 V130 A55,55 0 0,1 420,130 V300 Z"/>
        <path d="M535,300 V110 A65,65 0 0,1 665,110 V300 Z"/>
        <path d="M780,300 V130 A55,55 0 0,1 890,130 V300 Z"/>
        <path d="M970,300 V130 A55,55 0 0,1 1080,130 V300 Z"/>
      </g>
    </svg>
    <div class="dash-header-inner">
      <h1 class="gold-title">قَائِمْمَقَامِيَّةُ قَضَاءِ الفَلُّوجَةِ</h1>
      <p class="dash-sub" id="tDashSub">شعبة المنظمات</p>
      <div class="header-pills">

<script>
(function(){
  'use strict';

  /* طبقة تخزين آمنة محمية ضد أخطاء المتصفحات والملفات المحلية على الهاتف */
  var memStore = {};
  function safeGet(k){

      return v !== null ? v : (memStore[k] || null);
    } catch(e){
      return memStore[k] || null;
    }
  }
  function safeSet(k, v){
    memStore[k] = v;
    try { window.localStorage.setItem(k, v); } catch(e){}
  }

  var STORAGE_KEY = 'fallujah_qaim_orgs_v5';
  var SEC_KEYS = ['orgs', 'archive', 'staff', 'gallery'];

  var defaultData = {

      { id: 'o1', name: 'مؤسسة الفلوجة للإغاثة والتنمية', type: 'منظمة محلية', head: 'أحمد سامي العاني', phone: '07801122334', status: 'مفعلة' },

    ],

      { id: 'a1', title: 'كتاب اعتماد الفرق التطوعية 2026', fileType: 'Word', date: '2026-03-14', notes: 'صادر شعبة المنظمات - قائممقامية الفلوجة', fileUrl: '' },
      { id: 'a2', title: 'جدول إحصائية المنظمات العاملة', fileType: 'Excel', date: '2026-05-02', notes: 'تحديث بيانات المنظمات المحلية والدولية', fileUrl: '' }
    ],
    staff: [
      { id: 's1', name: 'محمد باسم', role: 'مسؤول شعبة المنظمات', unit: 'شعبة المنظمات', phone: '07810002233', notes: 'إدارة ومتابعة' },
      { id: 's2', name: 'علي حسين الكبيسي', role: 'منسق الفرق التطوعية', unit: 'وحدة المتابعة', phone: '07712223344', notes: 'تنسيق ميداني' }
    ],
    gallery: [
      { id: 'g1', title: 'اجتماع التنسيق الدوري للمنظمات', org: 'شعبة المنظمات - الفلوجة', date: '2026-04-18', img: '' },
      { id: 'g2', title: 'حملة تشجير وتأهيل حدائق الفلوجة', org: 'فريق شباب الفلوجة التطوعي', date: '2026-06-10', img: '' }
    ]
  };

  var state = {
    lang: 'ar',
    dark: false,
    carouselIdx: 0,
    activeSec: null,
    orgFilter: 'all',
    editId: null,
    selectMode: false,
    selectedIds: {},
    data: defaultData
  };

  try {
    var savedRaw = safeGet(STORAGE_KEY);
    if (savedRaw) {
      var parsed = JSON.parse(savedRaw);
      if (parsed && Array.isArray(parsed.orgs)) state.data = parsed;
    }
  } catch(e){}

  function persist(){
    try { safeSet(STORAGE_KEY, JSON.stringify(state.data)); } catch(e){}
  }

  var i18n = {
    ar: {
      gov1: 'جمهورية العراق',
      gov2: 'محافظة الأنبار - قائممقامية قضاء الفلوجة',
      gov3: 'شعبة المنظمات',
      secOne: 'القسم الأول',
      secTwo: 'القسم الثاني',
      fbEmailLbl: 'اكتب بريدك الإلكتروني',
      fbEmailPh: 'اكتب بريدك الإلكتروني هنا...',
      fbNotesLbl: 'إرسال ملاحظاتك',
      fbNotesPh: 'اكتب ملاحظاتك أو استفسارك لشعبة المنظمات هنا...',
      fbSubmit: 'إرسال ملاحظاتك',
      fbSent: 'تم إرسال ملاحظاتك بنجاح إلى شعبة المنظمات',
      enter: 'دخول إلى النظام',
      mainSec: 'الأقسام الرئيسية',
      logout: 'تسجيل الخروج',
      back: 'العودة للأقسام',
      add: '+ إضافة جديد',
      imp: 'استيراد وورد / إكسل',
      prt: 'طباعة A4',
      delMenu: 'قائمة الحذف ▾',
      delPart: 'مسح جزء مع التحديد',
      delAll: 'مسح الكل',
      selAll: 'تحديد الكل',
      delSel: 'حذف المحدد',
      cancel: 'إلغاء',
      searchPh: 'بحث فوري...',
      archSearchPh: 'اكتب اسم الملف أو الكلمة المفتاحية لإظهاره...',
      privacyMsg: 'الملفات مخفية حفاظاً على الخصوصية — اكتب اسم الملف أو الكلمة المفتاحية في مربع البحث لإظهاره.',
      noData: 'لا توجد سجلات مطابقة.',
      filters: [
        { k: 'all', l: 'الكل' },
        { k: 'منظمة محلية', l: 'منظمة محلية' },
        { k: 'منظمة دولية', l: 'منظمة دولية' },
        { k: 'فريق تطوعي', l: 'فريق تطوعي' }
      ],
      cards: [
        { key: 'orgs', title: 'سجل المنظمات والفرق التطوعية', badge: 'سجل نشط', desc: 'إضافة وتعديل وبحث وطباعة سجل المنظمات المحلية والدولية والفرق التطوعية.' },
        { key: 'archive', title: 'الأرشيف الإلكتروني والملفات', badge: 'خصوصية تامة', desc: 'رفع وحفظ ملفات PDF و Word و Excel والصور بسرية تامة حتى البحث عنها.' },
        { key: 'staff', title: 'موظفي شعبة المنظمات', badge: 'الكادر الإداري', desc: 'إدارة أسماء موظفي شعبة المنظمات وعناوينهم الوظيفية ووحداتهم وأرقام هواتفهم.' },
        { key: 'gallery', title: 'معرض النشاطات والصور', badge: 'التوثيق الإعلامي', desc: 'رفع وعرض صور النشاطات والاجتماعات مع اسم المنظمة والمعاينة بملء الشاشة.' }
      ]
    },
    en: {
      gov1: 'Republic of Iraq',
      gov2: 'Al Anbar Governorate - Fallujah District Qaim-Maqamiyah',
      gov3: 'Organizations Division',
      secOne: 'Section One',
      secTwo: 'Section Two',
      fbEmailLbl: 'Enter Your Email Address',
      fbEmailPh: 'Enter your email address here...',
      fbNotesLbl: 'Send Your Feedback',
      fbNotesPh: 'Write your notes or inquiry for the Organizations Division here...',
      fbSubmit: 'Send Your Feedback',
      fbSent: 'Your feedback has been sent successfully',
      enter: 'Enter System',
      mainSec: 'Main Sections',
      logout: 'Logout',
      back: 'Back to Sections',
      add: '+ Add New',
      imp: 'Import Word / Excel',
      prt: 'Print A4',
      delMenu: 'Delete Menu ▾',
      delPart: 'Partial Delete with Selection',
      delAll: 'Delete All',
      selAll: 'Select All',
      delSel: 'Delete Selected',
      cancel: 'Cancel',
      searchPh: 'Instant search...',
      archSearchPh: 'Type file name or keyword to reveal...',
      privacyMsg: 'Files are hidden for privacy — type the file name or keyword in the search box to reveal.',
      noData: 'No matching records found.',
      filters: [
        { k: 'all', l: 'All' },
        { k: 'منظمة محلية', l: 'Local Org' },
        { k: 'منظمة دولية', l: 'International Org' },
        { k: 'فريق تطوعي', l: 'Volunteer Team' }
      ],
      cards: [
        { key: 'orgs', title: 'Organizations & Volunteer Groups', badge: 'Active Registry', desc: 'Add, edit, search, and print local and international organizations and volunteer teams.' },
        { key: 'archive', title: 'Electronic Archive & Files', badge: 'Privacy Protected', desc: 'Upload and store PDF, Word, Excel, and image files privately until searched.' },
        { key: 'staff', title: 'Organizations Division Staff', badge: 'Staff Directory', desc: 'Manage division staff names, job titles, administrative units, and phone numbers.' },
        { key: 'gallery', title: 'Activities & Photo Gallery', badge: 'Media Gallery', desc: 'Upload and view activity and meeting photos with organization names in fullscreen.' }
      ]
    }
  };

  function byId(id){ return document.getElementById(id); }

  function showToast(msg){
    var el = byId('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.remove('hidden');
    clearTimeout(el._tid);
    el._tid = setTimeout(function(){ el.classList.add('hidden'); }, 2500);
  }

  function esc(s){
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* حلقة الكتابة الآلية المتحركة المستمرة داخل بطاقات الأقسام */
  var twHandles = [];
  function runTypewriters(){
    twHandles.forEach(function(h){ clearTimeout(h); });
    twHandles = [];
    var cards = i18n[state.lang].cards;
    cards.forEach(function(c, idx){
      var el = byId('tw-' + c.key);
      if (!el) return;
      var full = c.desc;
      var pos = 0;
      var erasing = false;
      function tick(){
        var target = byId('tw-' + c.key);
        if (!target || byId('cardsView').classList.contains('hidden')) return;
        if (!erasing){
          pos++;
          target.textContent = full.slice(0, pos);
          if (pos >= full.length){
            erasing = true;
            twHandles[idx] = setTimeout(tick, 1700);
            return;
          }
          twHandles[idx] = setTimeout(tick, 38);
        } else {
          pos--;
          target.textContent = full.slice(0, pos);
          if (pos <= 0){
            erasing = false;
            twHandles[idx] = setTimeout(tick, 400);
            return;
          }
          twHandles[idx] = setTimeout(tick, 20);
        }
      }
      twHandles[idx] = setTimeout(tick, idx * 220);
    });
  }

  /* بناء مسرح البطاقات ثلاثي الأبعاد 3D Coverflow Stage نظيف بدون أسهم أو نقاط أو نصوص إرشادية */
  function buildCardsStage(){
    var stage = byId('cardsStage');
    if (!stage) return;
    var cards = i18n[state.lang].cards;
    var svgs = {
      orgs: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
      archive: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
      staff: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
      gallery: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>'
    };

    stage.innerHTML = '';
    cards.forEach(function(c, idx){
      var art = document.createElement('article');
      art.className = 'sec-card-3d';
      art.id = 'card3d-' + idx;
      var cnt = (state.data[c.key] || []).length;
      art.innerHTML =
        '<div class="card-top"><div class="card-icon">' + svgs[c.key] + '</div><span class="badge">' + c.badge + ' (' + cnt + ')</span></div>' +
        '<h3 class="card-title">' + c.title + '</h3>' +
        '<div class="tw-bar"><span class="tw-text" id="tw-' + c.key + '"></span><span class="tw-cursor"></span></div>';
      art.addEventListener('click', function(){
        var active = ((state.carouselIdx % 4) + 4) % 4;
        if (idx !== active){
          state.carouselIdx = idx;
          positionCards3D();
        } else {
          openSection(SEC_KEYS[idx], 'next');
        }
      });
      stage.appendChild(art);
    });

    positionCards3D();
    runTypewriters();
  }

  function positionCards3D(){
    var total = 4;
    var active = ((state.carouselIdx % total) + total) % total;
    var isRtl = state.lang === 'ar';
    var spread = Math.min(window.innerWidth * 0.44, 260);

    for (var i = 0; i < total; i++){
      var card = byId('card3d-' + i);
      if (!card) continue;
      var diff = i - active;
      if (diff > 2) diff -= total;
      if (diff < -2) diff += total;

      var dir = isRtl ? -1 : 1;
      var tx = diff * spread * dir;
      var tz = diff === 0 ? 45 : (Math.abs(diff) === 1 ? -95 : -190);
      var ry = diff === 0 ? 0 : (diff * -38 * dir);
      var sc = diff === 0 ? 1 : (Math.abs(diff) === 1 ? 0.84 : 0.7);
      var op = diff === 0 ? 1 : (Math.abs(diff) === 1 ? 0.82 : 0.45);

      card.style.transform = 'translate3d(' + tx + 'px,0px,' + tz + 'px) rotateY(' + ry + 'deg) scale(' + sc + ')';
      card.style.opacity = String(op);
      card.style.zIndex = String(30 - Math.abs(diff) * 10);

      if (diff === 0){
        card.classList.add('is-center');
      } else {
        card.classList.remove('is-center');
      }
    }
  }

  /* التنقل والانعطاف ثلاثي الأبعاد 3D بين الخانات الداخلية */
  function renderTabs(){
    var box = byId('secTabs');
    if (!box) return;
    box.innerHTML = '';
    i18n[state.lang].cards.forEach(function(c){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'sec-tab' + (c.key === state.activeSec ? ' active' : '');
      b.textContent = c.title;
      b.addEventListener('click', function(){
        if (c.key === state.activeSec) return;
        var cur = SEC_KEYS.indexOf(state.activeSec);
        var nxt = SEC_KEYS.indexOf(c.key);
        openSection(c.key, nxt >= cur ? 'next' : 'prev');
      });
      box.appendChild(b);
    });
  }

  function openSection(key, dir){
    state.activeSec = key;
    state.carouselIdx = Math.max(0, SEC_KEYS.indexOf(key));
    state.orgFilter = 'all';
    cancelSelection();

    var t = i18n[state.lang];
    var info = t.cards.filter(function(x){ return x.key === key; })[0];
    byId('secTitle').textContent = info ? info.title : '';
    byId('printSecTitle').textContent = info ? info.title : '';

    var sInput = byId('searchInput');
    sInput.value = '';
    sInput.placeholder = key === 'archive' ? t.archSearchPh : t.searchPh;

    byId('cardsView').classList.add('hidden');
    byId('sectionView').classList.remove('hidden');

    renderTabs();
    renderOrgChips();

    var panel = byId('sectionPanel');
    panel.classList.remove('turn-next', 'turn-prev');
    void panel.offsetWidth;
    panel.classList.add(dir === 'prev' ? 'turn-prev' : 'turn-next');

    renderBody();
  }

  function backToCards(){
    state.activeSec = null;
    cancelSelection();
    byId('sectionView').classList.add('hidden');
    byId('cardsView').classList.remove('hidden');
    buildCardsStage();
  }

  function renderOrgChips(){
    var box = byId('orgChips');
    if (!box) return;
    if (state.activeSec !== 'orgs'){
      box.classList.add('hidden');
      return;
    }
    box.classList.remove('hidden');
    box.innerHTML = '';
    i18n[state.lang].filters.forEach(function(f){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (state.orgFilter === f.k ? ' active' : '');
      b.textContent = f.l;
      b.addEventListener('click', function(){
        state.orgFilter = f.k;
        renderOrgChips();
        renderBody();
      });
      box.appendChild(b);
    });

  function updateSelText(){
    var cnt = Object.keys(state.selectedIds).length;
    byId('selCountText').textContent = state.lang === 'ar' ? (cnt + ' محدد') : (cnt + ' selected');
  }

  function getFilteredItems(){
    var q = (byId('searchInput').value || '').trim().toLowerCase();
    var list = state.data[state.activeSec] || [];
    if (state.activeSec === 'orgs' && state.orgFilter !== 'all'){
      list = list.filter(function(x){ return x.type === state.orgFilter; });
    }
    if (state.activeSec === 'archive' && !q && !state.selectMode) return [];
    if (!q) return list;
    return list.filter(function(item){
      return Object.keys(item).some(function(k){
        return k !== 'id' && k !== 'img' && k !== 'fileUrl' && String(item[k]).toLowerCase().indexOf(q) !== -1;
      });
    });
  }

  /* استيراد ملفات الوورد والإكسل وCSV محلياً */
  function parseImportedFile(file){
    var baseName = file.name.replace(/\.[^.]+$/, '');
    var ext = (file.name.split('.').pop() || '').toLowerCase();
    var reader = new FileReader();

    reader.onload = function(ev){
      var raw = String(ev.target.result || '');
      var cleanLines = [];

      if (ext === 'csv' || ext === 'txt'){
        cleanLines = raw.split(/\r?\n/).map(function(l){ return l.trim(); }).filter(Boolean);
      } else {
        var stripped = raw.replace(/<[^>]+>/g, '\n');
        cleanLines = stripped.split(/\r?\n/).map(function(l){ return l.trim(); }).filter(function(l){
          return l.length >= 2 && /^[\u0600-\u06FFa-zA-Z0-9\s,;|\-_./]+$/.test(l);
        });
      }

      var added = 0;
      if (cleanLines.length > 0 && (ext === 'csv' || ext === 'txt')){
        cleanLines.forEach(function(line, i){
          var cols = line.split(/[,;|\t]+/).map(function(c){ return c.trim(); });
          if (!cols[0]) return;
          if (state.activeSec === 'orgs'){
            state.data.orgs.unshift({ id: 'imp_' + Date.now() + i, name: cols[0], type: cols[1] || 'منظمة محلية', head: cols[2] || 'مستورد', phone: cols[3] || '-', status: cols[4] || 'مفعلة' });
          } else if (state.activeSec === 'staff'){
            state.data.staff.unshift({ id: 'imp_' + Date.now() + i, name: cols[0], role: cols[1] || 'موظف شعبة', unit: cols[2] || 'شعبة المنظمات', phone: cols[3] || '-', notes: cols[4] || '-' });
          } else if (state.activeSec === 'archive'){
            state.data.archive.unshift({ id: 'imp_' + Date.now() + i, title: cols[0], fileType: cols[1] || 'Excel', date: '2026-11-22', notes: cols[2] || file.name, fileUrl: '' });
          } else {
            state.data.gallery.unshift({ id: 'imp_' + Date.now() + i, title: cols[0], org: cols[1] || 'شعبة المنظمات', date: '2026-11-22', img: '' });
          }
          added++;
        });
      }

      if (added === 0){
        var fType = (ext === 'xls' || ext === 'xlsx' || ext === 'csv') ? 'Excel' : (ext === 'pdf' ? 'PDF' : 'Word');
        if (state.activeSec === 'orgs'){
          state.data.orgs.unshift({ id: 'imp_' + Date.now(), name: baseName, type: 'منظمة محلية', head: 'ملف مستورد', phone: '-', status: 'مفعلة' });
        } else if (state.activeSec === 'staff'){
          state.data.staff.unshift({ id: 'imp_' + Date.now(), name: baseName, role: 'موظف شعبة المنظمات', unit: 'شعبة المنظمات', phone: '-', notes: file.name });
        } else if (state.activeSec === 'archive'){
          state.data.archive.unshift({ id: 'imp_' + Date.now(), title: baseName, fileType: fType, date: '2026-11-22', notes: 'ملف مستورد (' + file.name + ')', fileUrl: '' });
        } else {
          state.data.gallery.unshift({ id: 'imp_' + Date.now(), title: baseName, org: 'شعبة المنظمات - الفلوجة', date: '2026-11-22', img: '' });
        }
      }

      persist();
      if (state.activeSec === 'archive') byId('searchInput').value = baseName;
      renderBody();
      showToast((state.lang === 'ar' ? 'تم استيراد الملف بنجاح: ' : 'Imported: ') + file.name);
    };

    reader.readAsText(file);
  }

  /* تهيئة وربط كافة الأحداث بأمان */
  function initApp(){
    try {
      byId('enterBtn').addEventListener('click', function(){
        byId('landing').classList.add('hidden');
        byId('dashboard').classList.remove('hidden');
        backToCards();
      });

      byId('logoutBtn').addEventListener('click', function(){
        byId('dashboard').classList.add('hidden');
        byId('landing').classList.remove('hidden');
      });

      byId('feedbackForm').addEventListener('submit', function(e){
        e.preventDefault();
        var em = (byId('fbEmail').value || '').trim();
        var nt = (byId('fbNotes').value || '').trim();
        if (!em || !nt) return;
        try {
          var prev = JSON.parse(safeGet('fallujah_feedback_v1') || '[]');
          prev.unshift({ email: em, notes: nt, date: new Date().toISOString() });
          safeSet('fallujah_feedback_v1', JSON.stringify(prev));
        } catch(err){}
        byId('feedbackForm').reset();
        showToast(i18n[state.lang].fbSent);
      });

      byId('mainSecBtn').addEventListener('click', backToCards);
      byId('backBtn').addEventListener('click', backToCards);

      byId('themeBtn').addEventListener('click', function(){
        state.dark = !state.dark;
        document.body.classList.toggle('dark', state.dark);
        byId('themeBtn').textContent = state.dark ? '☾' : '☀';
      });

      byId('langBtn').addEventListener('click', function(){
        state.lang = state.lang === 'ar' ? 'en' : 'ar';
        applyLanguage();
      });

      byId('addBtn').addEventListener('click', function(){ openFormModal(null); });
      byId('printBtn').addEventListener('click', function(){ window.print(); });
      byId('searchInput').addEventListener('input', renderBody);

      byId('importTriggerBtn').addEventListener('click', function(){
        byId('fileImport').click();
      });
      byId('fileImport').addEventListener('change', function(e){
        if (e.target.files && e.target.files[0]){
          parseImportedFile(e.target.files[0]);
          e.target.value = '';
        }
      });

      /* قائمة الحذف المنسدلة */
      byId('delMenuBtn').addEventListener('click', function(e){
        e.stopPropagation();
        byId('deleteMenu').classList.toggle('hidden');
      });

      byId('delPartialBtn').addEventListener('click', function(){
        byId('deleteMenu').classList.add('hidden');
        state.selectMode = true;
        state.selectedIds = {};
        byId('selectionBar').classList.remove('hidden');
        updateSelText();
        renderBody();
      });

      byId('delAllBtn').addEventListener('click', function(){
        byId('deleteMenu').classList.add('hidden');
        openConfirm(state.lang === 'ar' ? 'هل أنت متأكد من مسح جميع السجلات في هذا القسم؟' : 'Delete all records in this section?', function(){
          state.data[state.activeSec] = [];
          persist();
          cancelSelection();
          showToast(state.lang === 'ar' ? 'تم مسح الكل' : 'All cleared');
        });
      });

      byId('selAllBtn').addEventListener('click', function(){
        var list = state.activeSec === 'archive' ? state.data.archive : getFilteredItems();
        var all = list.length > 0 && list.every(function(x){ return !!state.selectedIds[x.id]; });
        state.selectedIds = {};
        if (!all) list.forEach(function(x){ state.selectedIds[x.id] = true; });
        updateSelText();
        renderBody();
      });

      byId('delSelBtn').addEventListener('click', function(){
        var ids = Object.keys(state.selectedIds);
        if (!ids.length){
          showToast(state.lang === 'ar' ? 'يرجى تحديد عنصر واحد على الأقل' : 'Select at least one item');
          return;
        }
        openConfirm(state.lang === 'ar' ? 'حذف العناصر المحددة (' + ids.length + ')؟' : 'Delete selected (' + ids.length + ')?', function(){
          state.data[state.activeSec] = state.data[state.activeSec].filter(function(x){ return !state.selectedIds[x.id]; });
          persist();
          cancelSelection();
          showToast(state.lang === 'ar' ? 'تم حذف المحدد' : 'Selected deleted');
        });
      });

      byId('cancelSelBtn').addEventListener('click', cancelSelection);
      byId('formCancelBtn').addEventListener('click', function(){ byId('formModal').classList.add('hidden'); });
      byId('confCancelBtn').addEventListener('click', function(){ byId('confirmModal').classList.add('hidden'); });
      byId('previewCloseBtn').addEventListener('click', function(){ byId('previewModal').classList.add('hidden'); });
      byId('previewModal').addEventListener('click', function(e){
        if (e.target === byId('previewModal')) byId('previewModal').classList.add('hidden');
      });

      document.addEventListener('click', function(e){
        if (!e.target.closest('.dropdown')) byId('deleteMenu').classList.add('hidden');
      });

      /* حفظ بيانات النموذج */
      byId('recordForm').addEventListener('submit', function(e){
        e.preventDefault();
        var fd = new FormData(e.target);
        var rec = { id: state.editId || ('id_' + Date.now()) };
        fd.forEach(function(v, k){ if (typeof v === 'string') rec[k] = v.trim(); });

        function finish(){
          var arr = state.data[state.activeSec];
          if (state.editId){
            var i = arr.findIndex(function(x){ return x.id === state.editId; });
            if (i !== -1) arr[i] = Object.assign({}, arr[i], rec);
          } else {
            arr.unshift(rec);
          }
          persist();
          if (state.activeSec === 'archive' && rec.title) byId('searchInput').value = rec.title;
          byId('formModal').classList.add('hidden');
          renderBody();
          showToast(state.lang === 'ar' ? 'تم الحفظ بنجاح' : 'Saved');
        }

        var gInp = byId('galImgInp');
        var aInp = byId('archFileInp');
        if (state.activeSec === 'gallery' && gInp && gInp.files && gInp.files[0]){
          var r1 = new FileReader();
          r1.onload = function(ev){ rec.img = ev.target.result; finish(); };
          r1.readAsDataURL(gInp.files[0]);
        } else if (state.activeSec === 'archive' && aInp && aInp.files && aInp.files[0]){
          var r2 = new FileReader();
          r2.onload = function(ev){ rec.fileUrl = ev.target.result; finish(); };
          r2.readAsDataURL(aInp.files[0]);
        } else {
          finish();
        }
      });

      /* التمرير ثلاثي الأبعاد 3D بالسحب بالإصبع أو الفأرة على بطاقات الأقسام */
      var wrap = byId('carouselWrap');
      var sx = 0, dragging = false;
      wrap.addEventListener('touchstart', function(e){
        if (e.touches && e.touches[0]) sx = e.touches[0].clientX;
      }, { passive: true });
      wrap.addEventListener('touchend', function(e){
        if (!e.changedTouches || !e.changedTouches[0]) return;
        var dx = e.changedTouches[0].clientX - sx;
        if (Math.abs(dx) > 34){
          var isRtl = state.lang === 'ar';
          var step = (dx < 0 ? 1 : -1) * (isRtl ? -1 : 1);
          state.carouselIdx = (state.carouselIdx + step + 4) % 4;
          positionCards3D();
        }
      }, { passive: true });
      wrap.addEventListener('mousedown', function(e){ dragging = true; sx = e.clientX; });
      window.addEventListener('mouseup', function(e){
        if (!dragging) return;
        dragging = false;
        var dx = e.clientX - sx;
        if (Math.abs(dx) > 40){
          var isRtl = state.lang === 'ar';
          var step = (dx < 0 ? 1 : -1) * (isRtl ? -1 : 1);
          state.carouselIdx = (state.carouselIdx + step + 4) % 4;
          positionCards3D();
        }
      });

      /* الانعطاف ثلاثي الأبعاد 3D بالسحب الأفقي بين الخانات الداخلية */
      var vp = byId('panelVp');
      var psx = 0, psy = 0;
      vp.addEventListener('touchstart', function(e){
        if (e.touches && e.touches[0]){ psx = e.touches[0].clientX; psy = e.touches[0].clientY; }
      }, { passive: true });
      vp.addEventListener('touchchend', function(e){
        if (!e.changedTouches || !e.changedTouches[0]) return;
        if (e.target && e.target.closest('.table-wrap')) return;
        var dx = e.changedTouches[0].clientX - psx;
        var dy = e.changedTouches[0].clientY - psy;
        if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.4){
          var isRtl = state.lang === 'ar';
          var step = (dx < 0 ? 1 : -1) * (isRtl ? -1 : 1);
          var cur = Math.max(0, SEC_KEYS.indexOf(state.activeSec));
          var nxt = (cur + step + 4) % 4;
          openSection(SEC_KEYS[nxt], step > 0 ? 'next' : 'prev');
        }
      }, { passive: true });

      window.addEventListener('resize', function(){
        if (!byId('cardsView').classList.contains('hidden')) positionCards3D();
      });

      applyLanguage();
    } catch(err){
      console.error(err);
    }
  }

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', initApp);
  } else {
    initApp();
  }
})();
</script>
</body>
</html>
